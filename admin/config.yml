backend:
  name: git-gateway
  branch: main

local_backend: true
media_folder: uploads
public_folder: /uploads

logo_url: /favicon.svg

collections:
  - name: store
    label: Store Dashboard
    files:
      - name: catalogue
        label: Artwork & Pricing
        file: data/store.json
        format: json
        fields:
          - label: WhatsApp Number
            name: whatsappNumber
            widget: string
            hint: Use international format without + or spaces, for example 2348012345678.
          - label: Currency Symbol
            name: currency
            widget: string
            default: "₦"
          - label: Print Sizes & Prices
            name: printSizes
            widget: list
            summary: "{{fields.label}} — {{fields.dimensions}}"
            fields:
              - { label: Size label, name: label, widget: string }
              - { label: Dimensions, name: dimensions, widget: string }
              - label: Price
                name: price
                widget: number
                value_type: int
                required: false
                hint: Leave empty to show “Get a quote”.
          - label: Artworks
            name: artworks
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: ID, name: id, widget: string, hint: Lowercase words separated by hyphens. }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: story, widget: text }
              - { label: Original size, name: originalSize, widget: string }
              - { label: Artwork image, name: image, widget: image, required: false }
              - { label: Placeholder background, name: palette, widget: string, required: false }
              - { label: Placeholder accent, name: accent, widget: color, required: false }
              - { label: Show in shop, name: active, widget: boolean, default: true }
